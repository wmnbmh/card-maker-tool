<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>文字卡片生成器</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
  height:100%;overflow:hidden;background:#0a0a0a;
  touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
html{background:#0a0a0a;}

/* ===== 强制宋体 ===== */
body,#txt,#t1,#t2,#ta,#vBtn,#save,#payBox,.swn{
  font-family: serif !important;
  font-family:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",serif !important;
}

body{
  background:#0a0a0a;
  color:#ffffff;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}

#app{
  position:relative;
  height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  padding:14px 16px calc(12px + env(safe-area-inset-bottom));gap:12px;
}

/* ===== 预览区 ===== */
#stage{
  flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
}

/* ===== 卡片：实心背景，由 JS 写入纯色 / 渐变 / 照片 ===== */
#capture-area{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  background:#141419;
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 25px 50px rgba(0,0,0,0.6);
  color:#ffffff;
}
#capture-area.capture{
  border-color:transparent !important;
  box-shadow:none !important;
  border-radius:0 !important;
}

#inner{
  position:absolute;inset:0;z-index:2;overflow:hidden;
  padding:40px;
  display:flex;align-items:center;justify-content:center;
}
#txt{
  flex:0 0 auto;text-align:center;
  letter-spacing:2px;
  font-family:"Noto Serif SC","Songti SC",serif !important;
}
#t1,#t2{
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  line-height:2;
  color:#ffffff;
  text-shadow:0 2px 4px rgba(0,0,0,0.7);
}
#t1{font-weight:700;}
#t2{font-weight:400;opacity:0.7;}
#capture-area.vt #txt{writing-mode:vertical-rl;text-orientation:mixed;}

/* ===== 操作区 ===== */
#panel{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;}
#ta{
  width:100%;height:68px;resize:none;border:1px solid rgba(255,255,255,.08);outline:none;
  background:#17171c;border-radius:14px;color:#ececf2;
  font-size:16px;line-height:1.5;padding:11px 13px;
  user-select:text;-webkit-user-select:text;touch-action:pan-y;
  transition:border-color .2s ease,background .2s ease;
}
#ta:focus{border-color:rgba(255,255,255,.22);background:#1b1b21;}
#ta::placeholder{color:#5b5b66;}
#tplRow{
  display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:6px 2px 2px;
  touch-action:pan-x;scrollbar-width:none;
}
#tplRow::-webkit-scrollbar{display:none;}
.sw{flex:0 0 auto;width:42px;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;}
.dot{
  position:relative;width:38px;height:38px;border-radius:50%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
  transition:transform .18s ease,box-shadow .18s ease;
}
.sw:active .dot{transform:scale(.9);}
.sw.active .dot{box-shadow:0 0 0 2px #0a0a0a,0 0 0 3.5px #fff,inset 0 0 0 1px rgba(255,255,255,.16);}
.swn{font-size:9px;color:#9a9aa6;white-space:nowrap;letter-spacing:.01em;}
.sw.active .swn{color:#fff;}
.lock{
  position:absolute;top:-3px;left:-3px;width:16px;height:16px;border-radius:50%;
  background:#0a0a0a;box-shadow:0 0 0 1px rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:8px;line-height:1;
}
.dot.add{
  background:#141419;
  border:1px dashed rgba(255,255,255,.45);
  display:flex;align-items:center;justify-content:center;
  color:#ffffff;font-size:20px;line-height:1;
  box-shadow:none;
}
#actions{display:flex;gap:10px;}
#vBtn{
  flex:0 0 auto;height:48px;padding:0 16px;border-radius:15px;
  background:#17171c;border:1px solid rgba(255,255,255,.09);color:#dcdce4;
  font-size:14px;font-weight:600;letter-spacing:.03em;
  transition:transform .15s ease,opacity .15s ease;
}
#vBtn:active{transform:scale(.97);opacity:.85;}
#save{
  flex:1 1 auto;height:48px;border:none;border-radius:15px;
  background:linear-gradient(180deg,#fdfdfd,#e6e6ec);color:#111114;
  font-size:15px;font-weight:600;letter-spacing:.06em;
  box-shadow:0 8px 20px rgba(0,0,0,.45);
  transition:transform .15s ease,opacity .15s ease;
}
#save:active{transform:scale(.975);opacity:.88;}
#save:disabled{opacity:.55;transform:none;}

/* ===== 付费弹窗 ===== */
#payMask{
  position:fixed;inset:0;z-index:30;padding:22px;
  background:rgba(6,6,8,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
#payMask.show{opacity:1;pointer-events:auto;}
#payBox{
  width:100%;max-width:340px;max-height:88vh;overflow-y:auto;touch-action:pan-y;
  background:#15151a;border:1px solid rgba(255,255,255,.08);border-radius:22px;
  padding:24px 20px 18px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.65);
  transform:scale(.94) translateY(8px);
  transition:transform .26s cubic-bezier(.2,.9,.3,1);
}
#payMask.show #payBox{transform:scale(1) translateY(0);}
.ptitle{font-size:17px;font-weight:700;color:#f6f6fa;letter-spacing:.04em;}
.pdesc{font-size:13px;color:#e2b96a;margin:8px 0 16px;letter-spacing:.02em;}
.pqr{
  position:relative;width:200px;height:200px;margin:0 auto 12px;border-radius:10px;
  background:#0f0f13;border:1px dashed rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.pqr span{position:absolute;font-size:12px;color:#55555f;letter-spacing:.1em;}
.pqr img{position:relative;z-index:1;width:200px;border-radius:8px;background:#fff;}
.ptip{font-size:11.5px;line-height:1.7;color:#8b8b98;margin-bottom:14px;}
#payCode{
  width:100%;height:46px;border-radius:12px;background:#0f0f13;
  border:1px solid rgba(255,255,255,.1);color:#fff;text-align:center;
  font-size:17px;letter-spacing:.24em;outline:none;
  user-select:text;-webkit-user-select:text;touch-action:pan-y;
}
#payCode:focus{border-color:rgba(255,255,255,.3);}
#payErr{font-size:11.5px;color:#ff6b6b;height:16px;line-height:16px;opacity:0;transition:opacity .2s ease;margin-top:6px;}
.pbtns{display:flex;gap:10px;margin-top:10px;}
.pbtns button{
  flex:1;height:44px;border:none;border-radius:13px;font-size:14px;font-weight:600;
  transition:transform .15s ease,opacity .15s ease;
}
.pbtns button:active{transform:scale(.97);opacity:.85;}
#payOk{background:linear-gradient(180deg,#fff,#e6e6ec);color:#111114;}
#payCancel{background:#232329;color:#b9b9c4;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .35s ease;}

/* ===== 截图结果层 ===== */
#shot{
  position:fixed;inset:0;z-index:60;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
#shot.show{opacity:1;pointer-events:auto;}
.shint{color:#fff;font-size:14px;letter-spacing:.06em;opacity:.92;}
#shotImg{
  max-width:86vw;max-height:68vh;border-radius:4px;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  -webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto;
}

#toast{
  position:fixed;left:50%;top:50%;z-index:80;
  transform:translate(-50%,-50%) scale(.96);
  background:rgba(28,28,34,.96);color:#f2f2f6;font-size:13px;
  padding:11px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
  opacity:0;pointer-events:none;white-space:nowrap;
  transition:opacity .2s ease,transform .2s ease;
}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <div id="capture-area">
      <div id="inner">
        <div id="txt">
          <div id="t1"></div>
          <div id="t2"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="panel">
    <textarea id="ta" maxlength="220" spellcheck="false" placeholder="输入文字，第一行会放大显示…">愿你所行皆坦途
所遇皆温柔 所念皆如愿</textarea>
    <div id="tplRow"></div>
    <div id="actions">
      <button id="vBtn" type="button">横排</button>
      <button id="save" type="button">保存图片</button>
    </div>
  </div>
</div>

<input id="fileIn" type="file" accept="image/*" style="display:none">

<div id="payMask">
  <div id="payBox">
    <div class="ptitle">解锁全部高级功能</div>
    <div class="pdesc">赞赏 3.99 元即可永久解锁全部高级功能</div>
    <div class="pqr">
      <span>收款码</span>
      <img src="pay.png" alt="收款码" style="width:200px;border-radius:8px;" onerror="this.style.visibility='hidden'">
    </div>
    <div class="ptip">长按扫码支付后，截图发微信：brady1973 获取专属解锁码</div>
    <input id="payCode" inputmode="numeric" maxlength="16" autocomplete="off" placeholder="请输入解锁码">
    <div id="payErr">解锁码错误，请重试</div>
    <div class="pbtns">
      <button id="payCancel" type="button">稍后再说</button>
      <button id="payOk" type="button">确认解锁</button>
    </div>
  </div>
</div>

<div id="shot">
  <div class="shint">请长按图片保存到相册</div>
  <img id="shotImg" alt="文字卡片">
</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var stage=$('stage'),cap=$('capture-area'),
      inner=$('inner'),txt=$('txt'),t1=$('t1'),t2=$('t2'),ta=$('ta'),
      row=$('tplRow'),saveBtn=$('save'),vBtn=$('vBtn'),fileIn=$('fileIn'),
      payMask=$('payMask'),payBox=$('payBox'),payCode=$('payCode'),payErr=$('payErr'),
      shot=$('shot'),shotImg=$('shotImg'),toastEl=$('toast');

  var KEY_VIP='tcard_vip_v1', KEY_LAST='tcard_last_v1';

  /* 3 个免费纯色 + 6 个高级渐变 */
  var TPL=[
    {id:'ink',name:'暗夜黑',premium:false,bg:'#141419'},
    {id:'graphite',name:'石墨灰',premium:false,bg:'#2b2b31'},
    {id:'indigo',name:'藏青',premium:false,bg:'#17263a'},
    {id:'aurora',name:'极光之境',premium:true,
      bg:'linear-gradient(150deg,#06222f 0%,#0d4a52 28%,#1a8a78 55%,#3fc79f 77%,#6a5cff 100%)'},
    {id:'deepsea',name:'深海幽蓝',premium:true,
      bg:'linear-gradient(160deg,#020a18 0%,#062a4d 30%,#0f5f86 62%,#0a2b44 100%)'},
    {id:'nebula',name:'玫瑰星云',premium:true,
      bg:'linear-gradient(150deg,#1a0620 0%,#5c1040 30%,#b43f77 58%,#e88ab0 80%,#2a0a2e 100%)'},
    {id:'peach',name:'蜜桃落日',premium:true,
      bg:'linear-gradient(155deg,#5f1b34 0%,#a63a41 30%,#d9694a 58%,#f0a06a 82%,#8c2f42 100%)'},
    {id:'gold',name:'鎏金黑夜',premium:true,
      bg:'linear-gradient(150deg,#08080a 0%,#171006 28%,#3d2a0d 56%,#9a7a1f 80%,#d8b74a 100%)'},
    {id:'mint',name:'薄荷晨雾',premium:true,
      bg:'linear-gradient(150deg,#03120f 0%,#0a4a3e 30%,#1c8a72 60%,#63d3ae 84%,#0d3d33 100%)'}
  ];

  var vip=false;
  try{vip=localStorage.getItem(KEY_VIP)==='1';}catch(e){}
  var cur=0,pendingAct=null,busy=false,customMode=false;
  var PAD=40,toastTimer=0;

  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1700);
  }

  /* ---------- 排版 ---------- */
  function applyFont(f,isV){
    t1.style.fontSize=f.toFixed(2)+'px';
    t1.style.lineHeight='2';
    t2.style.fontSize=(f*0.5).toFixed(2)+'px';
    t2.style.lineHeight='2';
    var gap=(f*0.2).toFixed(1)+'px';
    if(isV){
      t2.style.marginTop='0';
      t2.style.marginRight=gap;
    }else{
      t2.style.marginRight='0';
      t2.style.marginTop=gap;
    }
  }

  function fit(){
    var availW=Math.max(10,inner.clientWidth-PAD*2);
    var availH=Math.max(10,inner.clientHeight-PAD*2);
    var isV=cap.classList.contains('vt');
    txt.style.width=isV?'auto':availW+'px';
    txt.style.height=isV?availH+'px':'auto';
    var f=Math.min(isV?availH*0.13:availW*0.15,64);
    var guard=0;
    for(;;){
      applyFont(f,isV);
      var w=txt.getBoundingClientRect().width;
      var h=txt.getBoundingClientRect().height;
      var over=isV?(w>availW+0.6):(h>availH+0.6);
      if(!over||f<=7||guard++>90) break;
      f=Math.max(7,f*0.93);
    }
  }

  function layout(){
    var w=stage.clientWidth,h=stage.clientHeight;
    if(w<10||h<10) return;
    var cw=Math.floor(Math.min(w,h*0.75));
    if(cw<1) return;
    var ch=Math.round(cw*4/3);
    cap.style.width=cw+'px';
    cap.style.height=ch+'px';
    cap.style.borderRadius=Math.round(cw*0.055)+'px';
    inner.style.padding=PAD+'px';
    fit();
  }

  function render(){
    var v=String(ta.value||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    var lines=v.split('\n');
    var first=lines.shift();
    t1.textContent=first||'';
    var rest=lines.join('\n');
    t2.textContent=rest;
    t2.style.display=rest?'block':'none';
    fit();
  }

  function markActive(index){
    var kids=row.children;
    for(var k=0;k<kids.length;k++) kids[k].classList.toggle('active',k===index);
  }

  /* ---------- 模板：背景直接刷在卡片上 ---------- */
  function apply(i){
    cur=i;
    customMode=false;
    var t=TPL[i];
    cap.style.background=t.bg;
    cap.style.backgroundSize='cover';
    cap.style.backgroundPosition='center center';
    cap.style.backgroundRepeat='no-repeat';
    cap.style.color='#ffffff';

    markActive(i);
    if(row.children[i]&&row.children[i].scrollIntoView){
      try{row.children[i].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}catch(e){}
    }
    try{localStorage.setItem(KEY_LAST,t.id);}catch(e){}
    fit();
  }

  function pick(i){
    if(TPL[i].premium&&!vip){openPay(function(){apply(i);});return;}
    apply(i);
  }

  function applyImage(url){
    customMode=true;
    cap.style.background='#111114';
    cap.style.backgroundImage='url("'+url+'")';
    cap.style.backgroundSize='cover';
    cap.style.backgroundPosition='center center';
    cap.style.backgroundRepeat='no-repeat';
    cap.style.color='#ffffff';
    markActive(TPL.length);
    try{localStorage.setItem(KEY_LAST,'custom');}catch(e){}
    fit();
  }

  function refreshLocks(){
    var kids=row.children;
    for(var i=0;i<TPL.length;i++){
      var lk=kids[i]?kids[i].querySelector('.lock'):null;
      if(lk&&(!TPL[i].premium||vip)){lk.parentNode.removeChild(lk);}
    }
    updateVBtn();
  }

  function updateVBtn(){
    var isV=cap.classList.contains('vt');
    vBtn.textContent=(isV?'竖排':'横排')+(vip?'':' 🔒');
  }

  /* ---------- 付费 ---------- */
  function openPay(act){
    pendingAct=act||null;
    payCode.value='';
    payErr.style.opacity='0';
    payMask.classList.add('show');
    setTimeout(function(){try{payCode.focus();}catch(e){}},260);
  }

  function closePay(){
    payMask.classList.remove('show');
    setTimeout(function(){pendingAct=null;},240);
  }

  function codeOk(v){
    try{return btoa(v)==='ODg4';}catch(e){return false;}
  }

  function confirmPay(){
    var v=String(payCode.value||'').trim();
    if(codeOk(v)){
      vip=true;
      try{localStorage.setItem(KEY_VIP,'1');}catch(e){}
      refreshLocks();
      var act=pendingAct;
      closePay();
      toast('已解锁全部高级功能');
      if(act){setTimeout(act,120);}
    }else{
      payErr.style.opacity='1';
      payBox.classList.remove('shake');
      void payBox.offsetWidth;
      payBox.classList.add('shake');
      payCode.value='';
      try{payCode.focus();}catch(e){}
    }
  }

  /* ---------- 截图 ---------- */
  function showShot(url){
    shotImg.src=url;
    shot.classList.add('show');
  }

  function isMobile(){
    return /Android|iPhone|iPad|iPod|Windows Phone|MicroMessenger|HarmonyOS|Mobile/i.test(navigator.userAgent)||window.innerWidth<820;
  }

  function baseOptions(W,H,scale,vw,vh){
    return {
      scale:scale,width:W,height:H,windowWidth:vw,windowHeight:vh,
      scrollX:0,scrollY:0,backgroundColor:null,useCORS:true,logging:false,
      imageTimeout:0,removeContainer:true,
      onclone:function(doc){
        var de=doc.documentElement,b=doc.body;
        de.style.width=vw+'px';de.style.height=vh+'px';de.style.overflow='hidden';de.style.background='#0a0a0a';
        if(b){b.style.position='static';b.style.margin='0';b.style.padding='0';b.style.width=vw+'px';b.style.height=vh+'px';b.style.overflow='hidden';b.style.background='#0a0a0a';}
        var app=doc.getElementById('app');
        if(app){app.style.height=vh+'px';app.style.overflow='hidden';}
        var c=doc.getElementById('capture-area');
        if(c){c.style.borderRadius='0';c.style.boxShadow='none';c.style.borderColor='transparent';}
      }
    };
  }

  function exportImage(){
    if(busy) return;
    var el=document.getElementById('capture-area');
    if(!el) return;

    busy=true;
    saveBtn.disabled=true;
    var label=saveBtn.textContent;
    saveBtn.textContent='生成中…';
    cap.classList.add('capture');

    var r=el.getBoundingClientRect();
    var W=Math.max(1,Math.round(r.width));
    var H=Math.max(1,Math.round(r.height));
    var vw=document.documentElement.clientWidth||window.innerWidth;
    var vh=document.documentElement.clientHeight||window.innerHeight;
    var scale=isMobile()?2:3;

    function restore(){
      cap.classList.remove('capture');
      saveBtn.disabled=false;
      saveBtn.textContent=label;
      busy=false;
    }

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        setTimeout(function(){
          if(!window.html2canvas){restore();toast('截图库加载失败，请检查网络');return;}
          html2canvas(el,baseOptions(W,H,scale,vw,vh))
            .then(function(canvas){
              if(!canvas||!canvas.height||Math.abs(canvas.width/canvas.height-0.75)>0.02){
                throw new Error('bad');
              }
              return canvas.toDataURL('image/png');
            })
            .then(function(url){
              restore();
              showShot(url);
            })
            .catch(function(){
              restore();
              toast('生成失败，请稍后重试');
            });
        },60);
      });
    });
  }

  /* ---------- 初始化 ---------- */
  function buildSwatches(){
    TPL.forEach(function(t,i){
      var b=document.createElement('button');
      b.type='button';
      b.className='sw';
      var dot=document.createElement('span');
      dot.className='dot';
      dot.style.background=t.bg;
      if(t.premium&&!vip){
        var lk=document.createElement('span');
        lk.className='lock';
        lk.textContent='🔒';
        dot.appendChild(lk);
      }
      var nm=document.createElement('span');
      nm.className='swn';
      nm.textContent=t.name;
      b.appendChild(dot);
      b.appendChild(nm);
      b.addEventListener('click',function(){pick(i);});
      row.appendChild(b);
    });

    /* 自定义传图按钮 */
    var cb=document.createElement('button');
    cb.type='button';
    cb.className='sw';
    var cd=document.createElement('span');
    cd.className='dot add';
    cd.textContent='+';
    var cn=document.createElement('span');
    cn.className='swn';
    cn.textContent='自定义';
    cb.appendChild(cd);
    cb.appendChild(cn);
    cb.addEventListener('click',function(){try{fileIn.click();}catch(e){}});
    row.appendChild(cb);
  }

  function bind(){
    ta.addEventListener('input',render);
    saveBtn.addEventListener('click',exportImage);

    fileIn.addEventListener('change',function(){
      var f=fileIn.files&&fileIn.files[0];
      if(!f) return;
      if(!/^image\//.test(f.type||'')){toast('请选择图片文件');fileIn.value='';return;}
      var fr=new FileReader();
      fr.onload=function(){
        applyImage(String(fr.result||''));
        toast('已设置为卡片背景');
        try{fileIn.value='';}catch(e){}
      };
      fr.onerror=function(){toast('图片读取失败，请重试');try{fileIn.value='';}catch(e){}};
      fr.readAsDataURL(f);
    });

    vBtn.addEventListener('click',function(){
      var act=function(){
        cap.classList.toggle('vt');
        updateVBtn();
        fit();
      };
      if(!vip){openPay(act);return;}
      act();
    });

    payOk.addEventListener('click',confirmPay);
    payCancel.addEventListener('click',closePay);
    payCode.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();confirmPay();}});
    payCode.addEventListener('input',function(){payErr.style.opacity='0';});
    payMask.addEventListener('click',function(e){if(e.target===payMask) closePay();});

    shot.addEventListener('click',function(e){
      if(e.target!==shotImg) shot.classList.remove('show');
    });

    document.addEventListener('contextmenu',function(e){
      var t=e.target;
      if(t&&t.closest&&(t.closest('textarea')||t.closest('input')||t.closest('#shotImg'))) return;
      e.preventDefault();
    });
    document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
    document.addEventListener('gesturestart',function(e){e.preventDefault();});

    window.addEventListener('orientationchange',function(){setTimeout(layout,320);});
    window.addEventListener('resize',function(){layout();});
    if(window.ResizeObserver){
      try{new ResizeObserver(function(){layout();}).observe(stage);}catch(e){}
    }
    if(document.fonts&&document.fonts.ready){
      document.fonts.ready.then(function(){layout();}).catch(function(){});
    }
  }

  function start(){
    buildSwatches();
    bind();
    layout();
    var idx=0;
    try{
      var last=localStorage.getItem(KEY_LAST);
      for(var i=0;i<TPL.length;i++){
        if(TPL[i].id===last&&(!TPL[i].premium||vip)){idx=i;break;}
      }
    }catch(e){}
    apply(idx);
    render();
    updateVBtn();
    requestAnimationFrame(function(){layout();render();});
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
})();
</script>
</body>
</html>
